name: Feature request
description: A language, adapter, detector, pattern or workflow Unknot should support.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and where Unknot fell short. Real examples (public code) help most.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The behaviour you would like. If it widens what the agent may do, say how a person stays in control.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language or framework adapter
        - Database, infrastructure or delivery adapter
        - Detector or finding
        - Decomposition
        - Planning, apply or verification
        - Policy, hooks, approvals or sandbox
        - Skills, agents or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
