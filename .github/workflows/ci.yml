name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing in CI needs more than a read of the repository; each job restates its own scope.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24', '26']
        include:
          # The engines.node floor, exactly. A test ties this to package.json.
          - os: ubuntu-latest
            node: '22.13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install bubblewrap and allow user namespaces (Linux sandbox tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Probe the bubblewrap sandbox
        if: runner.os == 'Linux'
        run: bwrap --ro-bind / / --unshare-net true && echo bwrap-ok
      - name: Unit, golden, adversarial and integration tests
        run: npm test
      - name: Benchmark smoke
        run: node scripts/bench.mjs --quick
      - name: Restore drill (also a release gate)
        run: node scripts/restore-drill.mjs

  validate-plugin:
    name: validate plugin manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate plugin (strict, pinned Claude Code)
        # The pin is the same one live.yml installs; bump both together.
        run: npx --yes @anthropic-ai/claude-code@2.1.289 plugin validate --strict .

  validate-plugin-latest:
    name: validate plugin manifest (latest Claude Code, not blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports an upstream break without failing the PR. Never a required check.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate plugin (strict, latest Claude Code)
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate --strict .

  upgrade:
    name: upgrade from previous releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every release tag is archived and run as the "old" version.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Map with the last five releases, then upgrade the same project in place
        run: node scripts/upgrade-test.mjs --count 5
