name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    name: build, attest and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job that may write: contents to create the release, id-token to obtain the
    # Sigstore signing identity, attestations to store the provenance statement.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Tag must match package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$version" || { echo "tag $TAG does not match package.json version $version"; exit 1; }
      - name: Test
        run: npm test
      - name: Build release
        run: node scripts/build-release.mjs --out dist
      - name: Verify release
        run: node scripts/verify-release.mjs dist
      - name: Attest build provenance (tarball and SBOM)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/sbom.cdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS dist/sbom.cdx.json \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag $pre
      - name: Advance the stable channel
        # The quintinbotes catalog installs Unknot from the `stable` branch; a final release moves
        # it to the tag. force=false makes it a fast-forward, so a tag behind stable fails here.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          sha="$(git rev-list -n 1 "$TAG")"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$sha" -F force=false
