name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    name: build, attest and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job that may write: contents to create the release, id-token to obtain the
    # Sigstore signing identity, attestations to store the provenance statement.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Tag must match package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$version" || { echo "tag $TAG does not match package.json version $version"; exit 1; }
      - name: Test
        run: npm test
      - name: Build release
        run: node scripts/build-release.mjs --out dist
      - name: Verify release
        run: node scripts/verify-release.mjs dist
      - name: Attest build provenance (tarball and SBOM)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/sbom.cdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS dist/sbom.cdx.json \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $pre
      - name: Advance the stable channel
        # The quintinbotes catalog installs Unknot from the `stable` branch; a final release moves
        # it to the tag. force=false makes it a fast-forward, so a tag behind stable fails here.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          sha="$(git rev-list -n 1 "$TAG")"
          cmd="git push git@github.com:$GITHUB_REPOSITORY.git $sha:refs/heads/stable"
          # GITHUB_TOKEN has no `workflows` permission, so GitHub refuses a ref update onto a
          # commit that changes .github/workflows. Say so instead of failing with a bare 403.
          stable="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" --jq .object.sha)"
          if ! git diff --quiet "$stable" "$sha" -- .github/workflows; then
            echo "::error::stable not advanced: $TAG changes .github/workflows and GITHUB_TOKEN cannot move a ref onto such a commit. The release is published. The owner runs: $cmd"
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$sha" -F force=false 2>"$RUNNER_TEMP/patch.err" || {
            cat "$RUNNER_TEMP/patch.err"
            if grep -q "HTTP 403" "$RUNNER_TEMP/patch.err"; then
              echo "::error::stable not advanced (HTTP 403). The release is published. The owner runs: $cmd"
            fi
            exit 1
          }
