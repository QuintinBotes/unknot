name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    name: build, attest and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job that may write: contents to create the release, id-token to obtain the
    # Sigstore signing identity, attestations to store the provenance statement.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Tag must match package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$version" || { echo "tag $TAG does not match package.json version $version"; exit 1; }
      - name: Test
        run: npm test
      - name: Build release
        run: node scripts/build-release.mjs --out dist
      - name: Verify release
        run: node scripts/verify-release.mjs dist
      - name: Attest build provenance (tarball and SBOM)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/sbom.cdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS dist/sbom.cdx.json \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
