name: unknot-verify

# Reusable: verify an Unknot slice on the commit `unknot pr` pushed, with no signing key and no
# Unknot state (#153; docs/forge-approvals.md, control 5). Call it from a workflow that runs on a
# push to `unknot/**`, in a job named `unknot`, pinned by commit SHA, so the check is
# `unknot / verify`. `unknot verify --from-ci <pr>` counts the evidence only when its attestation
# names this file at that pinned commit, the bound head and a push in the pinned repository.
on:
  workflow_call: {}

permissions: {}

jobs:
  run:
    name: run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The slice's own commands run here, so this job can only read: no OIDC token, no write.
    permissions:
      contents: read
    steps:
      - name: Check out the pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - name: Check out Unknot at this workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: unknot
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run the slice's command obligations
        working-directory: head
        run: node "$GITHUB_WORKSPACE/unknot/bin/unknot" verify --in-ci "$RUNNER_TEMP/unknot-evidence.json"
      # Upload even when a command failed: `--in-ci` then exits 1, which fails this job and the run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: unknot-evidence
          path: ${{ runner.temp }}/unknot-evidence.json
          if-no-files-found: error

  verify:
    name: verify
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs no repository code: it attests the evidence file and reports it.
    permissions:
      id-token: write
      attestations: write
      checks: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unknot-evidence
          path: ${{ runner.temp }}/evidence
      - name: Attest the evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/evidence/unknot-evidence.json
      - name: Report the obligations
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE: ${{ runner.temp }}/evidence/unknot-evidence.json
        run: |
          node -e '
            const e = JSON.parse(require("node:fs").readFileSync(process.env.EVIDENCE, "utf8"));
            const bad = e.results.filter((r) => !r.not_run && r.exit_code !== 0);
            const notRun = e.results.filter((r) => r.not_run);
            require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/not-run.md", notRun.map((r) => `- ${r.id} ${r.kind}: ${r.not_run}`).join("\n"));
            const esc = (s) => String(s).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            for (const r of bad) console.log(`::error::${esc(`${r.id} ${r.kind}: ${[].concat(r.command).join(" ")} exited ${r.exit_code}`)}`);
            process.exitCode = bad.length ? 1 : 0;
          ' || failed=1
          # Obligations CI cannot pass (a person, or a built-in check run locally) get a neutral check, never a green one.
          if [ -s "$RUNNER_TEMP/not-run.md" ]; then
            gh api --hostname github.com --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name='unknot / not run in CI' -f head_sha="$GITHUB_SHA" -f status=completed -f conclusion=neutral \
              -f 'output[title]=Obligations CI did not run' -F "output[summary]=@$RUNNER_TEMP/not-run.md" > /dev/null
          fi
          exit "${failed:-0}"
