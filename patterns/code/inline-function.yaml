schema_version: '1.0'
id: code.inline-function
name: 'Inline Function'
category: code
problem: 'A function body is as clear as its name, so the indirection only costs a hop.'
forces:
  - 'Trivial delegation adds reading cost'
  - 'Over-extraction fragments logic'
applicability_signals:
  - { id: trivial-body, description: 'Function body is a single forwarding line', predicate: { metric: function.lines, op: '<=', value: 3 } }
  - { id: few-refs, description: 'Function is called from one place', predicate: { metric: symbol.references, op: '<=', value: 1 } }
required_evidence: ['symbol reference graph', 'test coverage map']
preconditions:
  - { id: tests-characterized, description: 'Characterization tests pin current behaviour before the refactor', predicate: { metric: tests.characterization, op: '==', value: 1 } }
contraindications:
  - { id: public-api, description: 'Function is part of a public API', predicate: { metric: module.public_exports, op: '>=', value: 1 } }
  - { id: polymorphic, description: 'Function is overridden or part of an interface', predicate: { metric: interface.implementations, op: '>=', value: 2 } }
benefits:
  - 'Fewer hops'
  - 'Clearer flow'
liabilities:
  - 'Duplication if inlined into many sites'
  - 'Loses a name'
introduced_complexity:
  - 'Longer callers'
architecture_invariants:
  - 'Behaviour of every caller is unchanged'
transformations:
  - 'code.extract-function'
proof_obligations: [characterization, unit, typecheck, lint, diff-budget]
rollback_strategies: [revert]
composes_with: [code.inline-wrapper, code.remove-dead-code]
conflicts_with: [code.extract-function]
introduction_recipe:
  - 'Confirm the function is not overridden or public'
  - 'Replace each call with the body'
  - 'Delete the function once unreferenced'
removal_recipe:
  - 'Select the repeated inlined fragment'
  - 'Extract it back into a named function'
  - 'Replace the duplicates with calls'
version: 1.0.0
