schema_version: '1.0'
id: database.archive-cold-data
name: 'Archive Cold Data'
category: database
problem: 'Rarely used rows inflate hot tables, indexes and backups.'
forces:
  - 'Storage and index bloat'
  - 'Retention and legal holds'
applicability_signals:
  - { id: large-table, description: 'Table is very large', predicate: { metric: table.rows, op: '>', value: 10000000 } }
  - { id: low-scans, description: 'Indexes are rarely scanned', predicate: { metric: index.scans, op: '<', value: 100 } }
required_evidence: ['query statistics across a full peak cycle', 'restore test record', 'reconciliation report']
preconditions:
  - { id: observation-window, description: 'Observation spans at least one full peak and batch cycle before contract' }
  - { id: retention-approved, description: 'Retention and legal-hold rules are approved' }
  - { id: archive-verified, description: 'Archive is verified readable before any delete' }
contraindications:
  - { id: restore-untested, description: 'A restore has not been tested, so destructive or data-moving steps are blocked', predicate: { metric: backup.restore_tested, op: '==', value: 0 }, hard: true }
  - { id: legal-hold, description: 'Rows are under legal hold' }
  - { id: hot-queries, description: 'Queries still read old rows' }
benefits:
  - 'Smaller hot set'
  - 'Faster maintenance'
liabilities:
  - 'Archive retrieval is slower'
  - 'Reports spanning both stores'
introduced_complexity:
  - 'An archive store and retrieval path'
architecture_invariants:
  - 'Phases run in order: expand, migrate, validate, switch, observe, contract; contract waits for the observation window'
  - 'Unknot plans and rehearses on copies; execution happens only through the organisation delivery system'
transformations:
  - 'database.introduce-partitioning'
proof_obligations: [migration-rehearsal, reconciliation, rollback-rehearsal, human-review]
rollback_strategies: [restore, roll_forward]
composes_with: [database.introduce-partitioning]
conflicts_with: []
version: 1.0.0
