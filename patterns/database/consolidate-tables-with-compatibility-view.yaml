schema_version: '1.0'
id: database.consolidate-tables-with-compatibility-view
name: 'Consolidate Tables with Compatibility View'
category: database
problem: 'Near-duplicate tables split data that belongs together.'
forces:
  - 'Duplicate schemas drift'
  - 'Old readers depend on old names'
applicability_signals:
  - { id: similar-tables, description: 'Tables share nearly the same shape', predicate: { metric: duplication.similarity, op: '>', value: 0.8 } }
  - { id: multi-writer, description: 'Several writers touch them', predicate: { metric: table.writers, op: '>', value: 1 } }
required_evidence: ['query statistics across a full peak cycle', 'restore test record', 'reconciliation report']
preconditions:
  - { id: observation-window, description: 'Observation spans at least one full peak and batch cycle before contract' }
  - { id: readers-listed, description: 'All readers and writers are inventoried' }
contraindications:
  - { id: restore-untested, description: 'A restore has not been tested, so destructive or data-moving steps are blocked', predicate: { metric: backup.restore_tested, op: '==', value: 0 }, hard: true }
  - { id: divergent-semantics, description: 'Tables have different retention or access rules' }
benefits:
  - 'One table to evolve'
  - 'Old readers keep working via a view'
liabilities:
  - 'View hides cost'
  - 'Larger table'
introduced_complexity:
  - 'A compatibility view during transition'
architecture_invariants:
  - 'Phases run in order: expand, migrate, validate, switch, observe, contract; contract waits for the observation window'
  - 'Unknot plans and rehearses on copies; execution happens only through the organisation delivery system'
transformations:
  - 'database.merge-stores'
proof_obligations: [migration-rehearsal, reconciliation, rollback-rehearsal, human-review]
rollback_strategies: [restore, revert]
composes_with: [database.merge-stores]
conflicts_with: []
version: 1.0.0
