schema_version: '1.0'
id: database.merge-stores
name: 'Merge Stores'
category: database
problem: 'Several data stores hold related data for one boundary and sync between them is costly.'
forces:
  - 'Cross-store transactions and joins'
  - 'Operational overhead of many stores'
applicability_signals:
  - { id: cross-joins, description: 'Queries join across stores', predicate: { metric: boundary.cross_joins, op: '>', value: 0 } }
  - { id: cross-tx, description: 'Transactions span stores', predicate: { metric: boundary.cross_transactions, op: '>', value: 0 } }
required_evidence: ['query statistics across a full peak cycle', 'restore test record', 'reconciliation report']
preconditions:
  - { id: observation-window, description: 'Observation spans at least one full peak and batch cycle before contract' }
  - { id: sizes-fit, description: 'Capacity of the merged store is verified on a copy' }
contraindications:
  - { id: restore-untested, description: 'A restore has not been tested, so destructive or data-moving steps are blocked', predicate: { metric: backup.restore_tested, op: '==', value: 0 }, hard: true }
  - { id: different-engines, description: 'Access patterns need different engine types' }
  - { id: owner-split, description: 'Stores are owned by different teams', predicate: { metric: owners.count, op: '>=', value: 2 } }
benefits:
  - 'Local transactions'
  - 'Fewer systems to operate'
liabilities:
  - 'Larger blast radius'
  - 'Migration effort'
introduced_complexity:
  - 'Migration tooling and dual reads during transition'
architecture_invariants:
  - 'Phases run in order: expand, migrate, validate, switch, observe, contract; contract waits for the observation window'
  - 'Unknot plans and rehearses on copies; execution happens only through the organisation delivery system'
transformations:
  - 'database.remove-derived-store'
proof_obligations: [migration-rehearsal, reconciliation, rollback-rehearsal, human-review]
rollback_strategies: [restore, roll_forward]
composes_with: [database.consolidate-tables-with-compatibility-view]
conflicts_with: [database.split-schema-by-ownership]
version: 1.0.0
