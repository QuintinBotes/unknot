schema_version: '1.0'
id: database.remove-derived-store
name: 'Remove Derived Store'
category: database
problem: 'A store derived from another adds sync cost and staleness.'
forces:
  - 'Sync lag and drift'
  - 'Operational cost'
applicability_signals:
  - { id: no-reconcile, description: 'No reconciliation of the derived copy', predicate: { metric: data.reconciliation_tooling, op: '==', value: 0 } }
  - { id: cross-joins, description: 'Reads join the copy and source', predicate: { metric: boundary.cross_joins, op: '>', value: 0 } }
required_evidence: ['query statistics across a full peak cycle', 'restore test record', 'reconciliation report']
preconditions:
  - { id: observation-window, description: 'Observation spans at least one full peak and batch cycle before contract' }
  - { id: derivable, description: 'Everything in the store can be rebuilt from the source' }
  - { id: read-load-covered, description: 'The source can serve the read load' }
contraindications:
  - { id: restore-untested, description: 'A restore has not been tested, so destructive or data-moving steps are blocked', predicate: { metric: backup.restore_tested, op: '==', value: 0 }, hard: true }
  - { id: non-derivable, description: 'The store holds data not present in the source' }
  - { id: read-isolation, description: 'Read isolation is a requirement', predicate: { metric: driver.availability_isolation, op: '==', value: 1 } }
benefits:
  - 'One source of truth'
  - 'Lower cost'
liabilities:
  - 'Read latency may rise'
  - 'Source load rises'
introduced_complexity:
  - 'Temporary dual reads'
architecture_invariants:
  - 'Phases run in order: expand, migrate, validate, switch, observe, contract; contract waits for the observation window'
  - 'Unknot plans and rehearses on copies; execution happens only through the organisation delivery system'
transformations:
  - 'database.merge-stores'
proof_obligations: [migration-rehearsal, reconciliation, rollback-rehearsal, human-review]
rollback_strategies: [restore, revert]
composes_with: [database.merge-stores]
conflicts_with: []
version: 1.0.0
