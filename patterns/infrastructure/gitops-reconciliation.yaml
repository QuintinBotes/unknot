schema_version: '1.0'
id: infrastructure.gitops-reconciliation
name: 'GitOps Reconciliation'
category: infrastructure
problem: 'Running state diverges from reviewed declarations.'
forces:
  - 'Single source of truth'
  - 'Reconciler permissions are powerful'
applicability_signals:
  - { id: drift, description: 'Plans show unexpected changes', predicate: { metric: plan.replaces, op: '>', value: 0 } }
  - { id: unowned, description: 'Unowned resources exist', predicate: { metric: resource.owner_known, op: '==', value: 0 } }
required_evidence: ['infrastructure plan output', 'resource inventory', 'ownership tags']
preconditions:
  - { id: owners-known, description: 'Every affected resource has a known owner', predicate: { metric: resource.owner_known, op: '==', value: 1 } }
  - { id: repo-controls, description: 'Repository protections are in place' }
contraindications:
  - { id: plan-deletes, description: 'Reconciliation would delete resources', predicate: { metric: plan.deletes, op: '>', value: 0 }, hard: true }
  - { id: emergency-changes, description: 'Frequent manual changes remain unavoidable' }
benefits:
  - 'Audited change'
  - 'Self-healing state'
liabilities:
  - 'Reconciler is a privileged component'
  - 'Slow secret handling'
introduced_complexity:
  - 'A controller and repository layout'
architecture_invariants:
  - 'Unknot analyses plans only; apply and destroy happen through the organisation delivery system'
transformations: []
proof_obligations: [infra-plan, architecture-fitness, human-review]
rollback_strategies: [revert, roll_forward]
composes_with: [infrastructure.policy-as-code, infrastructure.immutable-infrastructure]
conflicts_with: []
version: 1.0.0
