schema_version: '1.0'
id: infrastructure.immutable-infrastructure
name: 'Immutable Infrastructure'
category: infrastructure
problem: 'Servers are patched in place and drift.'
forces:
  - 'Reproducibility'
  - 'Stateful hosts resist replacement'
applicability_signals:
  - { id: manual-resources, description: 'Resources are not code-owned', predicate: { metric: resource.owner_known, op: '==', value: 0 } }
  - { id: drift, description: 'Plans show replacements', predicate: { metric: plan.replaces, op: '>', value: 0 } }
required_evidence: ['infrastructure plan output', 'resource inventory', 'ownership tags']
preconditions:
  - { id: owners-known, description: 'Every affected resource has a known owner', predicate: { metric: resource.owner_known, op: '==', value: 1 } }
  - { id: state-externalised, description: 'State is held outside the instance' }
contraindications:
  - { id: stateful-host, description: 'Instance stores unreplicated state' }
  - { id: plan-deletes, description: 'Plan deletes resources', predicate: { metric: plan.deletes, op: '>', value: 0 }, hard: true }
benefits:
  - 'Known-good images'
  - 'Easy rollback'
liabilities:
  - 'Image pipeline needed'
  - 'Slower emergency fixes'
introduced_complexity:
  - 'Image build and rollout pipeline'
architecture_invariants:
  - 'Unknot analyses plans only; apply and destroy happen through the organisation delivery system'
transformations: []
proof_obligations: [infra-plan, architecture-fitness, human-review]
rollback_strategies: [revert, recreate]
composes_with: [infrastructure.gitops-reconciliation, infrastructure.pin-artifact-digests]
conflicts_with: []
version: 1.0.0
