schema_version: '1.0'
id: infrastructure.import-manual-resources
name: 'Import Manual Resources'
category: infrastructure
problem: 'Manually created resources exist outside code.'
forces:
  - 'Reproducibility'
  - 'Import can mis-describe live state'
applicability_signals:
  - { id: unowned, description: 'Resources have no code owner', predicate: { metric: resource.owner_known, op: '==', value: 0 } }
  - { id: drift, description: 'Plans show diffs on imported resources', predicate: { metric: plan.replaces, op: '>', value: 0 } }
required_evidence: ['infrastructure plan output', 'resource inventory', 'ownership tags']
preconditions:
  - { id: inventory, description: 'Resource inventory is complete' }
  - { id: read-only-first, description: 'First plan after import is read-only and shows no changes' }
contraindications:
  - { id: plan-deletes, description: 'The plan deletes resources, so a no-op or refactor claim is false', predicate: { metric: plan.deletes, op: '>', value: 0 }, hard: true }
  - { id: plan-replaces, description: 'Plan replaces imported resources', predicate: { metric: plan.replaces, op: '>', value: 0 }, hard: true }
benefits:
  - 'Reviewable infrastructure'
  - 'Drift detection'
liabilities:
  - 'Attribute mismatches'
  - 'Import effort'
introduced_complexity:
  - 'Import blocks and ownership tags'
architecture_invariants:
  - 'Unknot analyses plans only; apply and destroy happen through the organisation delivery system'
transformations: []
proof_obligations: [infra-plan, human-review, scope-check]
rollback_strategies: [revert, roll_forward]
composes_with: [infrastructure.gitops-reconciliation, infrastructure.quarantine-then-retire-orphans]
conflicts_with: []
version: 1.0.0
