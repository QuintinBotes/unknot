schema_version: '1.0'
id: infrastructure.inline-one-use-wrapper-module
name: 'Inline One-Use Wrapper Module'
category: infrastructure
problem: 'A module wraps a single resource and adds only indirection.'
forces:
  - 'Indirection cost'
  - 'Module interface lock-in'
applicability_signals:
  - { id: passthrough, description: 'Module forwards variables to one resource', predicate: { metric: wrapper.passthrough_ratio, op: '>', value: 0.8 } }
  - { id: single-use, description: 'Module is used once', predicate: { metric: symbol.references, op: '<=', value: 1 } }
required_evidence: ['infrastructure plan output', 'resource inventory', 'ownership tags']
preconditions:
  - { id: owners-known, description: 'Every affected resource has a known owner', predicate: { metric: resource.owner_known, op: '==', value: 1 } }
  - { id: no-op-plan, description: 'Plan after inlining shows no changes' }
contraindications:
  - { id: plan-deletes, description: 'The plan deletes resources, so a no-op or refactor claim is false', predicate: { metric: plan.deletes, op: '>', value: 0 }, hard: true }
  - { id: plan-replaces, description: 'Plan replaces resources, for example from address changes', predicate: { metric: plan.replaces, op: '>', value: 0 }, hard: true }
benefits:
  - 'Fewer files'
  - 'Clearer resource definition'
liabilities:
  - 'State addresses move'
  - 'Loses a reuse seam'
introduced_complexity:
  - 'State move blocks'
architecture_invariants:
  - 'Unknot analyses plans only; apply and destroy happen through the organisation delivery system'
transformations: []
proof_obligations: [infra-plan, diff-budget, human-review]
rollback_strategies: [revert, roll_forward]
composes_with: [infrastructure.split-state-by-blast-radius]
conflicts_with: [infrastructure.extract-iac-module]
version: 1.0.0
