schema_version: '1.0'
id: infrastructure.landing-zone-guardrails
name: 'Landing Zone Guardrails'
category: infrastructure
problem: 'New accounts and subscriptions lack baseline security and cost controls.'
forces:
  - 'Consistent baseline across accounts'
  - 'Guardrails must not block legitimate work'
applicability_signals:
  - { id: wildcards, description: 'Policies contain wildcard permissions', predicate: { metric: iam.wildcards, op: '>', value: 0 } }
  - { id: public, description: 'Public ingress exists', predicate: { metric: network.public_ingress, op: '==', value: 1 } }
required_evidence: ['infrastructure plan output', 'resource inventory', 'ownership tags']
preconditions:
  - { id: owners-known, description: 'Every affected resource has a known owner', predicate: { metric: resource.owner_known, op: '==', value: 1 } }
  - { id: baseline-agreed, description: 'A baseline is agreed with security' }
contraindications:
  - { id: single-account, description: 'One small account with one team', predicate: { metric: team.count, op: '<=', value: 1 } }
  - { id: plan-deletes, description: 'Plan deletes existing resources', predicate: { metric: plan.deletes, op: '>', value: 0 }, hard: true }
benefits:
  - 'Baseline enforced everywhere'
  - 'Faster safe onboarding'
liabilities:
  - 'Central team dependency'
  - 'Exceptions need a process'
introduced_complexity:
  - 'Organisation-level policy and account vending'
architecture_invariants:
  - 'Unknot analyses plans only; apply and destroy happen through the organisation delivery system'
transformations:
  - 'infrastructure.policy-as-code'
proof_obligations: [infra-plan, architecture-fitness, human-review]
rollback_strategies: [revert, roll_forward]
composes_with: [infrastructure.policy-as-code, infrastructure.hub-and-spoke-network]
conflicts_with: []
version: 1.0.0
