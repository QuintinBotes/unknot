schema_version: '1.0'
id: infrastructure.merge-lockstep-stacks
name: 'Merge Lockstep Stacks'
category: infrastructure
problem: 'Separate stacks always change and deploy together.'
forces:
  - 'Coordination cost'
  - 'Larger blast radius'
applicability_signals:
  - { id: lockstep, description: 'Stacks deploy together', predicate: { metric: service.deploy_coupling, op: '>', value: 0.5 } }
  - { id: small, description: 'Stacks are small', predicate: { metric: service.count, op: '<=', value: 5 } }
required_evidence: ['infrastructure plan output', 'resource inventory', 'ownership tags']
preconditions:
  - { id: owners-known, description: 'Every affected resource has a known owner', predicate: { metric: resource.owner_known, op: '==', value: 1 } }
  - { id: no-op-plan, description: 'Plan after the merge shows no changes' }
contraindications:
  - { id: plan-deletes, description: 'The plan deletes resources, so a no-op or refactor claim is false', predicate: { metric: plan.deletes, op: '>', value: 0 }, hard: true }
  - { id: plan-replaces, description: 'Plan replaces resources', predicate: { metric: plan.replaces, op: '>', value: 0 }, hard: true }
benefits:
  - 'One deployment'
  - 'No cross-stack drift'
liabilities:
  - 'Bigger plans'
  - 'Harder ownership split'
introduced_complexity:
  - 'State merge steps'
architecture_invariants:
  - 'Unknot analyses plans only; apply and destroy happen through the organisation delivery system'
transformations: []
proof_obligations: [infra-plan, architecture-fitness, human-review]
rollback_strategies: [revert, roll_forward]
composes_with: [infrastructure.inline-one-use-wrapper-module]
conflicts_with: [infrastructure.split-state-by-blast-radius]
version: 1.0.0
