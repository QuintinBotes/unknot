schema_version: '1.0'
id: infrastructure.namespace-tenancy
name: 'Namespace Tenancy'
category: infrastructure
problem: 'Many teams need isolation without a cluster each.'
forces:
  - 'Cost efficient sharing'
  - 'Soft isolation only'
applicability_signals:
  - { id: many-teams, description: 'Several teams share infrastructure', predicate: { metric: team.count, op: '>=', value: 3 } }
  - { id: small-workloads, description: 'Each workload is small', predicate: { metric: service.count, op: '>=', value: 10 } }
required_evidence: ['infrastructure plan output', 'resource inventory', 'ownership tags']
preconditions:
  - { id: owners-known, description: 'Every affected resource has a known owner', predicate: { metric: resource.owner_known, op: '==', value: 1 } }
  - { id: quotas-defined, description: 'Resource quotas and network policies are defined' }
contraindications:
  - { id: hard-isolation, description: 'Compliance demands hard isolation', predicate: { metric: driver.security_isolation, op: '==', value: 1 } }
  - { id: plan-replaces, description: 'Plan replaces resources', predicate: { metric: plan.replaces, op: '>', value: 0 }, hard: true }
benefits:
  - 'Lower cost'
  - 'Shared platform tooling'
liabilities:
  - 'Noisy-neighbour risk'
  - 'Weaker isolation'
introduced_complexity:
  - 'Quotas, policies and RBAC per namespace'
architecture_invariants:
  - 'Unknot analyses plans only; apply and destroy happen through the organisation delivery system'
transformations: []
proof_obligations: [infra-plan, architecture-fitness, human-review]
rollback_strategies: [revert, roll_forward]
composes_with: [infrastructure.policy-as-code]
conflicts_with: [infrastructure.cluster-per-environment, infrastructure.cell-isolation]
version: 1.0.0
