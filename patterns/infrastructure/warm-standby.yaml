schema_version: '1.0'
id: infrastructure.warm-standby
name: 'Warm Standby'
category: infrastructure
problem: 'Cold recovery is too slow, but active-active is too costly.'
forces:
  - 'Shorter recovery time'
  - 'Standing cost'
applicability_signals:
  - { id: availability-driver, description: 'Availability isolation is required', predicate: { metric: driver.availability_isolation, op: '==', value: 1 } }
  - { id: restore-tested, description: 'Restores have been tested', predicate: { metric: backup.restore_tested, op: '==', value: 1 } }
required_evidence: ['infrastructure plan output', 'resource inventory', 'ownership tags']
preconditions:
  - { id: owners-known, description: 'Every affected resource has a known owner', predicate: { metric: resource.owner_known, op: '==', value: 1 } }
  - { id: drill-scheduled, description: 'Failover drills are scheduled' }
contraindications:
  - { id: untested-restore, description: 'Restores are untested', predicate: { metric: backup.restore_tested, op: '==', value: 0 }, hard: true }
  - { id: plan-deletes, description: 'Plan deletes resources', predicate: { metric: plan.deletes, op: '>', value: 0 }, hard: true }
benefits:
  - 'Faster failover'
  - 'Continuous replication validated'
liabilities:
  - 'Pays for idle capacity'
  - 'Drift between sites'
introduced_complexity:
  - 'A scaled-down duplicate stack'
architecture_invariants:
  - 'Unknot analyses plans only; apply and destroy happen through the organisation delivery system'
transformations: []
proof_obligations: [infra-plan, architecture-fitness, human-review]
rollback_strategies: [fail_over, recreate]
composes_with: [infrastructure.active-passive-recovery, infrastructure.multi-zone]
conflicts_with: []
version: 1.0.0
