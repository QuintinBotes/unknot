schema_version: "1.0"
id: messaging.correlation-identifier
name: "Correlation identifier"
category: messaging
problem: "Replies, retries and distributed logs cannot be matched to the original request."
forces:
  - "Traceability versus carrying one more header."
applicability_signals:
  - { id: traces-unavailable-across-hops, description: "Traces unavailable across hops", predicate: { metric: traces.available, op: '==', value: 0 } }
  - { id: asynchronous-flows-spanning-services, description: "Asynchronous flows spanning services" }
required_evidence:
  - "Message contracts and producer/consumer inventory"
  - "Delivery, lag and failure metrics for the channel"
preconditions: []
contraindications:
  - { id: single-in-process-flow-with, description: "Single in-process flow with existing request ids" }
benefits:
  - "End-to-end tracing and reply matching"
  - "Aids dedupe"
liabilities:
  - "Must be propagated everywhere"
introduced_complexity:
  - "Propagation conventions"
architecture_invariants:
  - "Message contracts are versioned and changed only compatibly."
  - "Consumers tolerate duplicates and unknown fields."
transformations:
  - "Introduce the construct on one channel behind the existing producer or consumer interface."
  - "Run old and new in parallel and compare before cutover."
proof_obligations: [contract, integration, unit, human-review]
rollback_strategies: [revert, roll_forward]
composes_with: [messaging.request-reply, distributed.saga-choreography, messaging.message-history]
conflicts_with: []
introduction_recipe:
  - "Generate at the edge."
  - "Propagate in every message header and log line."
removal_recipe:
  - "Remove only after reply matching and tracing no longer rely on it."
version: 1.0.0
