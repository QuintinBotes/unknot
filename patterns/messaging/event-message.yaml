schema_version: "1.0"
id: messaging.event-message
name: "Event message"
category: messaging
problem: "Components must learn that something happened without the publisher dictating the response."
forces:
  - "Loose coupling versus uncertain consumer behavior."
applicability_signals:
  - { id: publisher-announces-a-business-fact, description: "Publisher announces a business fact" }
  - { id: many-potential-reactors, description: "Many potential reactors" }
required_evidence:
  - "Message contracts and producer/consumer inventory"
  - "Delivery, lag and failure metrics for the channel"
preconditions:
  - { id: event-names-are-in-past, description: "Event names are in past tense and owned by the publisher" }
contraindications:
  - { id: sender-needs-a-specific-action, description: "Sender needs a specific action performed (use a command)" }
  - { id: only-synchronous-confirmation-is-acceptable, description: "Only synchronous confirmation is acceptable" }
benefits:
  - "Decoupled reactions"
  - "Natural audit stream"
liabilities:
  - "Hard to know who reacts"
introduced_complexity:
  - "Event catalog and versioning"
architecture_invariants:
  - "Message contracts are versioned and changed only compatibly."
  - "Consumers tolerate duplicates and unknown fields."
transformations:
  - "Introduce the construct on one channel behind the existing producer or consumer interface."
  - "Run old and new in parallel and compare before cutover."
proof_obligations: [contract, integration, unit, human-review]
rollback_strategies: [revert, roll_forward]
composes_with: [messaging.publish-subscribe, distributed.event-sourcing, distributed.saga-choreography]
conflicts_with: []
introduction_recipe:
  - "Define event with id, time, type and version."
  - "Publish via an outbox."
removal_recipe:
  - "Replace with direct calls for needed consumers."
  - "Retire the event type after zero subscribers."
version: 1.0.0
