schema_version: "1.0"
id: messaging.message-filter
name: "Message filter"
category: messaging
problem: "Consumers receive messages they do not care about."
forces:
  - "Efficiency versus filter logic placement."
applicability_signals:
  - { id: consumers-discard-many-received-messages, description: "Consumers discard many received messages" }
required_evidence:
  - "Message contracts and producer/consumer inventory"
  - "Delivery, lag and failure metrics for the channel"
preconditions:
  - { id: filter-criteria-are-stable, description: "Filter criteria are stable" }
contraindications:
  - { id: filtering-would-hide-messages-that, description: "Filtering would hide messages that audit needs" }
  - { id: topic-split-is-cheaper, description: "Topic split is cheaper" }
benefits:
  - "Less wasted processing"
liabilities:
  - "Silent drops hide mistakes"
introduced_complexity:
  - "Filter rules and drop metrics"
architecture_invariants:
  - "Message contracts are versioned and changed only compatibly."
  - "Consumers tolerate duplicates and unknown fields."
transformations:
  - "Introduce the construct on one channel behind the existing producer or consumer interface."
  - "Run old and new in parallel and compare before cutover."
proof_obligations: [contract, integration, unit, human-review]
rollback_strategies: [revert, roll_forward]
composes_with: [messaging.content-based-router, messaging.publish-subscribe, messaging.wire-tap]
conflicts_with: []
introduction_recipe:
  - "Filter at the subscription."
  - "Count drops."
removal_recipe:
  - "Remove the filter and handle in consumers."
version: 1.0.0
