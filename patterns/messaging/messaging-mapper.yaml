schema_version: "1.0"
id: messaging.messaging-mapper
name: "Messaging mapper"
category: messaging
problem: "Domain objects and message formats are entangled."
forces:
  - "Independence of domain model and wire format versus mapping code."
applicability_signals:
  - { id: domain-objects-serialized-directly-into, description: "Domain objects serialized directly into messages" }
required_evidence:
  - "Message contracts and producer/consumer inventory"
  - "Delivery, lag and failure metrics for the channel"
preconditions: []
contraindications:
  - { id: trivial-one-to-one-structures, description: "Trivial one-to-one structures where mapping adds nothing" }
benefits:
  - "Domain evolves apart from wire contract"
liabilities:
  - "Mapping code to maintain"
introduced_complexity:
  - "Mapper per message type"
architecture_invariants:
  - "Message contracts are versioned and changed only compatibly."
  - "Consumers tolerate duplicates and unknown fields."
transformations:
  - "Introduce the construct on one channel behind the existing producer or consumer interface."
  - "Run old and new in parallel and compare before cutover."
proof_obligations: [contract, integration, unit, human-review]
rollback_strategies: [revert, roll_forward]
composes_with: [messaging.messaging-gateway, messaging.canonical-data-model, messaging.document-message]
conflicts_with: []
introduction_recipe:
  - "Create explicit message DTOs."
  - "Map at the boundary."
removal_recipe:
  - "Serialize domain directly only if contract stability is not required."
version: 1.0.0
