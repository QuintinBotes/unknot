schema_version: "1.0"
id: messaging.splitter
name: "Splitter"
category: messaging
problem: "One message contains multiple items that must be processed independently."
forces:
  - "Parallelism versus losing batch atomicity."
applicability_signals:
  - { id: composite-message-with-independent-items, description: "Composite message with independent items" }
required_evidence:
  - "Message contracts and producer/consumer inventory"
  - "Delivery, lag and failure metrics for the channel"
preconditions:
  - { id: items-can-be-processed-independently, description: "Items can be processed independently" }
  - { id: correlation-of-parts-is-preserved, description: "Correlation of parts is preserved" }
contraindications:
  - { id: items-must-be-processed-atomically, description: "Items must be processed atomically as one unit" }
  - { id: only-one-item-per-message, description: "Only one item per message" }
benefits:
  - "Parallel item processing"
  - "Smaller failure units"
liabilities:
  - "Need to reassemble results"
introduced_complexity:
  - "Part identity and sequence metadata"
architecture_invariants:
  - "Message contracts are versioned and changed only compatibly."
  - "Consumers tolerate duplicates and unknown fields."
transformations:
  - "Introduce the construct on one channel behind the existing producer or consumer interface."
  - "Run old and new in parallel and compare before cutover."
proof_obligations: [contract, integration, unit, human-review]
rollback_strategies: [revert, roll_forward]
composes_with: [messaging.aggregator, messaging.scatter-gather, messaging.correlation-identifier]
conflicts_with: []
introduction_recipe:
  - "Emit part messages with group id, index and count."
removal_recipe:
  - "Reinstate batch processing."
  - "Drain in-flight parts first."
version: 1.0.0
