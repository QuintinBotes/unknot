schema_version: "1.0"
id: migration.progressive-delivery
name: "Progressive delivery"
category: migration
problem: "Release risk is managed ad hoc rather than through staged exposure with automatic analysis."
forces:
  - "Automated safety versus pipeline and metric complexity."
applicability_signals:
  - { id: frequent-releases-with-measurable-slis, description: "Frequent releases with measurable SLIs", predicate: { metric: metrics.available, op: '==', value: 1 } }
required_evidence:
  - "Consumer inventory for the old path"
  - "Usage metrics or traces for old and new paths"
preconditions:
  - { id: slo-based-health-analysis-is, description: "SLO-based health analysis is automated" }
  - { id: rollback-is-automatic, description: "Rollback is automatic" }
contraindications:
  - { id: no-metrics-for-automated-analysis, description: "No metrics for automated analysis", predicate: { metric: metrics.available, op: '==', value: 0 }, hard: true }
  - { id: low-release-frequency-manual-staged, description: "Low release frequency; manual staged rollout suffices" }
benefits:
  - "Exposure grows only while health holds"
  - "Automatic rollback on regression"
liabilities:
  - "Controller and analysis tooling to maintain"
introduced_complexity:
  - "Rollout controller, analysis templates and thresholds"
architecture_invariants:
  - "The old path stays fully functional until observed usage reaches zero."
  - "Removal of the old path is a separate slice, never bundled with the switch."
transformations:
  - "Add the new path alongside the old behind a switch that defaults to old."
  - "Migrate and validate on the new path before moving any traffic."
  - "Safe sequence: expand, migrate, validate, switch, observe, contract. Contract (removing the old path) is its own slice taken only after old-path usage reaches zero."
proof_obligations: [smoke, performance, rollback-rehearsal]
rollback_strategies: [revert, roll_forward]
composes_with: [migration.canary-release, migration.feature-flags, migration.dark-launch]
conflicts_with: []
introduction_recipe:
  - "Define SLIs and thresholds."
  - "Automate stepwise promotion with abort on breach."
removal_recipe:
  - "Revert to manual promotion."
  - "Remove the controller after confirming no rollout uses it."
version: 1.0.0
