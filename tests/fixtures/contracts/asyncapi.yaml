asyncapi: 2.6.0
info:
  title: Order events
  version: 2.0.0
servers:
  prod:
    url: kafka.example.com:9092
    protocol: kafka
channels:
  orders.created:
    bindings:
      kafka: {}
    publish:
      operationId: onOrderCreated
      message:
        name: OrderCreated
  orders.cancelled:
    subscribe:
      operationId: sendOrderCancelled
      message:
        oneOf:
          - $ref: '#/components/messages/OrderCancelled'
