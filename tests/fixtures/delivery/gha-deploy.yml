name: Deploy production
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: docker build -t registry.example.com/shop/checkout:${{ github.sha }} services/checkout
      - run: docker build -t registry.example.com/shop/pricing:${{ github.sha }} services/pricing
  deploy-checkout:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
      - run: helm upgrade --install checkout ./charts/checkout --namespace shop
      - run: kubectl rollout status deployment/checkout
  deploy-pricing:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
      - run: helm upgrade --install pricing ./charts/pricing --namespace shop
      - run: kubectl rollout status deployment/pricing
