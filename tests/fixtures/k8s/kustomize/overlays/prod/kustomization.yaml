apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: billing-prod
resources:
  - ../../base
  - https://github.com/example/shared-config//base
patches:
  - path: replicas.yaml
images:
  - name: registry.example.com/billing
    newTag: 1.2.0
secretGenerator:
  - name: billing-secret
    literals:
      - API_KEY=literal-kustomize-secret-value
