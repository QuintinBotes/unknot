name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [ main, 'release/**' ]
env:
  NODE_VERSION: 22
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build and test
        run: |
          npm ci
          npm test -- --coverage
        env:
          CI: true
      - name: Folded
        run: >-
          echo one
          two
